# build.yml - FinWise Desktop CI/CD
# ---------------------------------------------------------------------------
# Every push / pull request to main:
#   1. test   run the unit tests on Windows
#   2. exe    package FinWise.exe with `flet pack` (PyInstaller)
# Every tag like v1.0.0:
#   3. release  create a GitHub Release with FinWise.exe attached
# ---------------------------------------------------------------------------
name: Build FinWise Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover tests
      - name: Draw icon
        run: python tools/make_icon.py
      - name: Package FinWise.exe
        run: >
          flet pack main.py
          --name FinWise
          --icon assets/icon.ico
          --product-name "FinWise"
          --file-description "FinWise - Quan ly tien va hoc tai chinh"
          --product-version "1.0.0"
          --file-version "1.0.0.0"
          --copyright "FinWise"
          -y
      - uses: actions/upload-artifact@v4
        with:
          name: finwise-desktop
          path: dist/FinWise.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finwise-desktop
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/FinWise.exe
          body: |
            ## FinWise Desktop ${{ github.ref_name }}

            Tải `FinWise.exe` và nhấn đúp để chạy - không cần cài Python.
            Lần đầu, Windows SmartScreen có thể cảnh báo vì file chưa được ký số:
            chọn **More info → Run anyway**.
